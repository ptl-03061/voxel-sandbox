name: Android build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Install NDK + build tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"

      - name: Unzip and build
        run: |
          unzip src.zip
          cd VoxelSandbox/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -x ./gradlew ]; then ./gradlew :app:assembleDebug; else gradle :app:assembleDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: VoxelSandbox-upgraded-debug
          path: VoxelSandbox/android/app/build/outputs/apk/debug/*.apk
